<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF8E53" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1926" />
      <stop offset="100%" stop-color="#0F0C14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 107, 107, 0.25)" stroke-width="1.5" />

  <!-- Feather Icon -->
  <g transform="translate(12, 12) scale(1.666)" filter="url(#glow)">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" 
          fill="none" 
          stroke="url(#featherGrad)" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <line x1="16" y1="8" x2="2" y2="22" 
          stroke="url(#featherGrad)" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <line x1="17.5" y1="15" x2="9" y2="15" 
          stroke="url(#featherGrad)" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
