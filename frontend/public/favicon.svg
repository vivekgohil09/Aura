<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5FEF" />
      <stop offset="55%" stop-color="#8067E8" />
      <stop offset="100%" stop-color="#6D8CFF" />
    </linearGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.15)" />
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5B5FEF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle with Gradient and Specular Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#auraBg)" stroke="url(#rimGlow)" stroke-width="1.5" filter="url(#auraGlow)" />

  <!-- Crisp Signature Feather Emblem -->
  <g transform="translate(14, 14) scale(1.5)" stroke="#FFFFFF" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
    <line x1="16" y1="8" x2="2" y2="22" />
    <line x1="17.5" y1="15" x2="9" y2="15" />
  </g>
</svg>
