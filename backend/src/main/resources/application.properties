server.port=5000

# =========================================================
# MySQL Database Configuration (Localhost MySQL)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/chitchat_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD

# JPA & Schema SQL Initialization Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never

# JWT Secret & Expiration
jwt.secret=YOUR_JWT_SECRET_HERE
jwt.expiration=2592000000

# Google OAuth Credentials
google.client.id=YOUR_GOOGLE_CLIENT_ID
google.client.secret=YOUR_GOOGLE_CLIENT_SECRET
