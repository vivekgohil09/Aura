[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://aura-vdcq.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws/*"
  to = "https://aura-vdcq.onrender.com/ws/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://aura-vdcq.onrender.com/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
